name: HyperFrames Story Parity

on:
  pull_request:
    paths:
      - "content-factory/**"
      - "hyperframes/**"
      - "scripts/build-hyperframes.mjs"
      - "scripts/content-factory.test.mjs"
      - ".github/workflows/hyperframes-static.yml"
  push:
    paths:
      - "content-factory/**"
      - "hyperframes/**"
      - "scripts/build-hyperframes.mjs"
      - "scripts/content-factory.test.mjs"
      - ".github/workflows/hyperframes-static.yml"

permissions:
  contents: read

jobs:
  static-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: node scripts/build-hyperframes.mjs --check
      - run: node --test scripts/content-factory.test.mjs
